<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terminalGradient" x1="32" y1="24" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172A46"/>
      <stop offset="1" stop-color="#0B1424"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="56" y1="160" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62E6C2"/>
      <stop offset="1" stop-color="#56B9FF"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="280" height="280" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#06101F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Terminal icon -->
  <g filter="url(#shadow)">
    <rect x="32" y="32" width="224" height="224" rx="42" fill="url(#terminalGradient)"/>
    <rect x="32.75" y="32.75" width="222.5" height="222.5" rx="41.25" stroke="#315273" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M32 88H256" stroke="#315273" stroke-opacity="0.72" stroke-width="2"/>
    <circle cx="66" cy="61" r="7" fill="#FF6B6B"/>
    <circle cx="91" cy="61" r="7" fill="#FFD166"/>
    <circle cx="116" cy="61" r="7" fill="#62E6C2"/>
    <path d="M67 132L101 163L67 194" stroke="url(#accentGradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M125 196H191" stroke="#F4F8FC" stroke-width="13" stroke-linecap="round"/>
    <circle cx="204" cy="196" r="6.5" fill="#62E6C2"/>
  </g>

  <!-- Wordmark -->
  <text x="316" y="153" fill="#10233D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="750" letter-spacing="-3">Teundeun</text>
  <text x="321" y="220" fill="#4C9DCE" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" letter-spacing="3">CLI</text>
  <path d="M316 264H744" stroke="#D7E5F0" stroke-width="3" stroke-linecap="round"/>
  <text x="316" y="313" fill="#52677D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="500" letter-spacing="0.2">Save and resume your AI coding sessions.</text>
</svg>
